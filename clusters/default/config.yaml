apiVersion: v1
kind: ConfigMap
metadata:
  name: element-config
  namespace: element-web
  labels:
    app.kubernetes.io/name: element-web
    app.kubernetes.io/part-of: kudofools
    app.kubernetes.io/managed-by: flux
data:
  config.json: |
    {
        "default_server_config": {
            "m.homeserver": {
                "base_url": "https://conduit.kudofools.dev",
                "server_name": "conduit.kudofools.dev"
            }
        },
        "disable_custom_urls": true,
        "disable_guests": true,
        "default_federate": true
    }
